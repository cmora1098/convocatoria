<div class="row btn-page">
    <div class="col-md-12">
        <app-card cardTitle="Asignación de Evaluadores" [options]="false">

            <!-- Filtros -->
            <div class="row align-items-end g-2">
                <div class="col-md-2">
                    <label class="form-label">Año</label>
                    <select class="form-control">
                        <option value="">Todos</option>
                        <option>2025</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Convocatoria</label>
                    <select class="form-control">
                        <option value="">Seleccione</option>
                        <option>Convocatoria A</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <button type="button" class="btn btn-info">
                        <i class="feather icon-search me-1"></i>
                        Buscar
                    </button>
                </div>
            </div>

            <hr class="my-4" />

            <!-- División de Listas -->
            <div class="row mt-3">
                <!-- Evaluadores disponibles -->
                <div class="col-md-5">
                    <h5>Evaluadores Disponibles</h5>
                    <ul class="list-group">
                        <li class="list-group-item" *ngFor="let evaluador of evaluadoresDisponibles"
                            (click)="toggleSeleccion(evaluador, 'disponibles')" [class.active]="evaluador.seleccionado"
                            style="cursor: pointer">
                            {{ evaluador.nombre }}
                        </li>
                    </ul>
                </div>

                <!-- Botones -->
                <div class="col-md-2 d-flex flex-column align-items-center justify-content-center">
                    <button class="btn btn-primary mb-2 w-75" (click)="asignarSeleccionados()">
                        <i class="feather icon-arrow-right"></i> Asignar
                    </button>
                    <button class="btn btn-danger w-75" (click)="quitarSeleccionados()">
                        <i class="feather icon-arrow-left"></i> Quitar
                    </button>
                </div>

                <!-- Evaluadores asignados -->
                <div class="col-md-5">
                    <h5>Evaluadores Asignados</h5>
                    <ul class="list-group">
                        <li class="list-group-item" *ngFor="let evaluador of evaluadoresAsignados"
                            (click)="toggleSeleccion(evaluador, 'asignados')" [class.active]="evaluador.seleccionado"
                            style="cursor: pointer">
                            {{ evaluador.nombre }}
                        </li>
                    </ul>
                </div>
            </div>
        </app-card>
    </div>
</div>

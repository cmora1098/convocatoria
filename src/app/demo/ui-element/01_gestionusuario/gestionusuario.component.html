<!-- Vista de Lista de Convocatorias -->
<div class="row btn-page"> <!-- *ngIf="mostrarLista" -->
    <div class="col-md-12">
        <app-card cardTitle="" [options]="false">

            <!-- Filtros -->
            <div class="row align-items-end g-2">
                <div class="col-md-2">
                    <label class="form-label">Rol</label>
                    <select class="form-control">
                        <option value="">Todos</option>
                        <option>Administrador</option>
                        <option>Evaluador</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" placeholder="Correo Electrónico" class="form-control" />
                </div>

                <div class="col-md-2">
                    <label class="form-label">Nombre del Usuario</label>
                    <input type="text" placeholder="Nombre del Usuario" class="form-control" />
                </div>

                <div class="col-md-2">
                    <button type="button" class="btn btn-info">
                        <i class="feather icon-search me-1"></i>
                        Buscar
                    </button>
                </div>
            </div>

            <div class="my-4"></div>

            <!-- Tabla dinámica -->
            <div class="table-responsive">
                <table class="table table-striped table-bordered">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Nombre Usuario</th>
                            <th>Correo</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody>

                        <!-- Ejemplo de fila -->
                        <tr>
                            <td>1</td>
                            <td>ComiteCAS1</td>
                            <td>comitecas1</td>
                            <td>Evaluador</td>
                            <td>
                                <button type="button" class="btn btn-success">Activo</button>
                            </td>
                            <td>
                                <button class="btn btn-sm btn-warning me-1">
                                    <i class="feather icon-edit"></i>
                                </button>
                                <button class="btn btn-sm btn-danger">
                                    <i class="feather icon-trash-2"></i>
                                </button>
                            </td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>Administrador</td>
                            <td>administrador</td>
                            <td>Administrador</td>
                            <td>
                                <button type="button" class="btn btn-success">Activo</button>
                            </td>
                            <td>
                                <button class="btn btn-sm btn-warning me-1">
                                    <i class="feather icon-edit"></i>
                                </button>
                                <button class="btn btn-sm btn-danger">
                                    <i class="feather icon-trash-2"></i>
                                </button>
                            </td>
                        </tr> 
                    </tbody>
                </table>
            </div>

            <!-- Paginación -->
            <nav>
                <ul class="pagination justify-content-end">
                    <li class="page-item disabled"><a class="page-link">Anterior</a></li>
                    <li class="page-item active"><a class="page-link" href="#">1</a></li>
                    <li class="page-item"><a class="page-link" href="#">2</a></li>
                    <li class="page-item"><a class="page-link" href="#">Siguiente</a></li>
                </ul>
            </nav>
        </app-card>
    </div>
</div>

<div class="row btn-page">
    <!-- [ button-icon ] start -->
    <div class="col-md-6">
        <app-card cardTitle="Button With Icon" [options]="false">
            <div class="d-flex flex-wrap gap-2">
                <button type="button" class="btn btn-primary">
                    <i class="feather icon-thumbs-up me-1"></i>
                    Primary
                </button>
                <button type="button" class="btn btn-secondary">
                    <i class="feather icon-camera me-1"></i>
                    Secondary
                </button>
                <button type="button" class="btn btn-success">
                    <i class="feather icon-check-circle me-1"></i>
                    Success
                </button>
                <button type="button" class="btn btn-danger">
                    <i class="feather icon-slash me-1"></i>
                    Danger
                </button>
                <button type="button" class="btn btn-warning text-dark">
                    <i class="feather icon-alert-triangle me-1"></i>
                    Warning
                </button>
                <button type="button" class="btn btn-info">
                    <i class="feather icon-info me-1"></i>
                    Info
                </button>
            </div>
        </app-card>
    </div>
    <!-- [ button-icon ] end -->
    <!-- [ button-outline ] start -->
    <div class="col-md-6">
        <app-card cardTitle="Outline Icon BUttons" [options]="false">

                    <i class="feather icon-info me-1"></i>

        </app-card>
    </div>
    <!-- [ button-outline ] end -->
    <!-- [ only-icon ] start -->
    <div class="col-md-6">
        <app-card cardTitle="Only Icon" [options]="false">
            <div class="d-flex flex-wrap gap-2">

                    <i class="feather icon-thumbs-up"></i>
                </button>
                <button type="button" class="btn btn-icon btn-secondary d-inline-flex">

                <button type="button" class="btn btn-icon btn-info d-inline-flex">
                    <i class="feather icon-info"></i>
                </button>
            </div>
        </app-card>
    </div>
    <!-- [ only-icon ] end -->
    <!-- [ outline-icon ] start -->
    <div class="col-md-6">

            <div class="d-flex flex-wrap gap-2">

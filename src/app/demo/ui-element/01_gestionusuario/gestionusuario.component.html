<!-- Vista de Lista de Usuario -->
<div class="row btn-page" *ngIf="mostrarLista">
    <div class="col-md-12">
        <app-card cardTitle="" [options]="false">

            <!-- Botón principal -->
            <div class="mb-3 text-start">
                <button type="button" class="btn btn-primary" (click)="nuevoUsuario()">
                    <i class="feather icon-plus me-1"></i>
                    Nuevo Usuario
                </button>
            </div>

            <!-- Separador -->
            <hr />

            <!-- Filtros -->
            <div class="row align-items-end g-2">
                <div class="col-md-2">
                    <label class="form-label">Rol</label>
                    <select class="form-control" [(ngModel)]="filtros.rol">
                        <option value="">Todos</option>
                        <option value="1">Administrador</option>
                        <option value="2">Evaluador</option>
                        <option value="3">Postulante</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" placeholder="Correo Electrónico" class="form-control"
                        [(ngModel)]="filtros.email" />
                </div>

                <div class="col-md-2">
                    <label class="form-label">Nombre del Usuario</label>
                    <input type="text" placeholder="Nombre del Usuario" class="form-control"
                        [(ngModel)]="filtros.nombrecompleto" (keypress)="soloLetras($event)" />
                </div>

                <div class="col-md-2">
                    <button type="button" class="btn btn-info" (click)="Buscar()">
                        <i class="feather icon-search me-1"></i>
                        Buscar
                    </button>

                </div>
            </div>

            <div class="my-4"></div>

            <!-- Tabla dinámica -->
            <div class="table-responsive">
                <table class="table table-striped table-bordered" *ngIf="usuarios.length > 0">
                    <thead class="table-light">
                        <tr>
                            <!-- <th>ID</th> -->
                            <th>Nombre Usuario</th>
                            <th>Correo</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let usuario of usuarios">
                            <!-- <td>{{ usuario.iCodusuario }}</td> -->
                            <td>{{ usuario.nombres}} {{ usuario.apePaterno}} {{ usuario.apeMaterno}}</td>
                            <td>{{ usuario.correoElectronico }}</td>
                            <td>{{ usuario.codRol }}</td>
                            <td>
                                <button type="button" class="btn btn-sm"
                                    [ngClass]="{'btn-success': usuario.activo,'btn-danger': !usuario.activo}">
                                    {{
                                    usuario.activo ? 'Activo' : 'Inactivo' }}</button>
                            </td>
                            <td>
                                <button class="btn btn-sm btn-warning me-1" [disabled]="!usuario.activo"
                                    (click)="editarusuario(usuario)">

                                    <i class="feather icon-edit"></i> Editar
                                </button>

                                <button class="btn btn-sm btn-danger" [disabled]="!usuario.activo"
                                    (click)="eliminarusuario(usuario.idUsuario)">
                                    <i class="feather icon-trash-2"></i> Eliminar
                                </button>

                            </td>
                        </tr>

                    </tbody>
                </table>

                <!-- Sin resultados -->
                <div *ngIf="usuarios.length === 0" class="text-center text-muted my-4">
                    <p>No se encontraron usuarios con los filtros aplicados.</p>
                </div>
            </div>

            <!-- Resumen -->
            <!-- <div *ngIf="usuarios.length > 0" class="text-end my-2">
                Página {{ paginaActual }} de {{ totalPaginas }}
            </div> -->

            <!-- Paginación -->
            <nav *ngIf="totalPaginas > 1">
                <ul class="pagination justify-content-end">

                    <!-- Anterior -->
                    <li class="page-item" [class.disabled]="paginaActual === 1">
                        <a class="page-link" (click)="anteriorPagina()">Anterior</a>
                    </li>

                    <!-- Botones de página -->
                    <li class="page-item" *ngFor="let i of [].constructor(totalPaginas); let index = index"
                        [class.active]="paginaActual === (index + 1)">
                        <a class="page-link" (click)="irPagina(index + 1)">{{ index + 1 }}</a>
                    </li>

                    <!-- Siguiente -->
                    <li class="page-item" [class.disabled]="paginaActual === totalPaginas">
                        <a class="page-link" (click)="siguientePagina()">Siguiente</a>
                    </li>

                </ul>
            </nav>

        </app-card>
    </div>
</div>

<!-- Vista de Formulario de Nueva o Edición de Usuario -->
<div class="row btn-page" *ngIf="!mostrarLista">
    <div class="col-md-12">
        <app-card [cardTitle]="modoEdicion ? 'Editar Usuario' : 'Nuevo Usuario'" [options]="false">
            <form>

                <!-- Campo ID -->
                <div *ngIf="modoEdicion" class="mb-3">
                    <label class="form-label">ID</label>
                    <input class="form-control" name="id" type="text" [value]="usuarioSeleccionada?.id" readonly
                        disabled>
                </div>

                <!-- Tipo de Documento y Número -->
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Tipo</label>
                        <select id="tipo-doc" required class="form-control" name="tipoDoc"
                            [(ngModel)]="usuarioSeleccionada.tipoDocumentos" aria-label="Tipo de Documento">

                            <option [ngValue]="null">Seleccione</option>
                            <option *ngFor="let tipo of tiposDocumentos" [ngValue]="tipo">
                                {{ tipo.nombreDocumento }}
                            </option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Número de Documento</label>
                        <input id="num-doc" type="text" placeholder="Número de Documento" required pattern="^\d{1,15}$"
                            maxlength="15" [(ngModel)]="usuarioSeleccionada.NumDocumento" inputmode="numeric"
                            class="form-control" name="NumDoc" aria-label="Número de Documento"
                            (keypress)="permitirSoloNumeros($event)" />
                    </div>


                </div>

                <!-- Apellidos -->
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="apellido-paterno" class="form-label">Apellido Paterno</label>
                        <input id="apellido-paterno" type="text" placeholder="Apellido Paterno" name="apePat" required
                            [(ngModel)]="usuarioSeleccionada.ApePaterno" class="form-control"
                            aria-label="Apellido Paterno" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+"
                            (keypress)="soloLetras($event)" />
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="apellido-materno" class="form-label">Apellido Materno</label>
                        <input id="apellido-materno" type="text" placeholder="Apellido Materno" name="apeMat" required
                            [(ngModel)]="usuarioSeleccionada.ApeMaterno" class="form-control"
                            aria-label="Apellido Materno" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+"
                            (keypress)="soloLetras($event)" />
                    </div>
                </div>

                <!-- Nombre completo -->
                <div class="form-group mb-3">
                    <label for="nombre-completo" class="form-label">Nombre Completo</label>
                    <input id="nombre-completo" type="text" placeholder="Nombre Completo" required class="form-control"
                        name="NombreCompleto" [(ngModel)]="usuarioSeleccionada.NomCompleto" aria-label="Nombre Completo"
                        pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+" (keypress)="soloLetras($event)" />
                </div>


                <!-- Correo -->
                <div class="form-group mb-3">
                    <label for="correo" class="form-label">Correo Electrónico</label>
                    <input id="correo" type="email" placeholder="Correo Electrónico" required class="form-control"
                        name="email" [(ngModel)]="usuarioSeleccionada.Email" aria-label="Correo Electrónico" />
                </div>

                <!-- Contraseña -->
                <div class="form-group mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input id="password" type="password" placeholder="Ingresa tu contraseña" name="Contrasenia" required
                        [(ngModel)]="usuarioSeleccionada.Contrasenia" class="form-control" aria-label="Contraseña" />
                </div>

                <!-- Rol -->
                <div class="form-group mb-3">
                    <label class="form-label">Rol</label>
                    <select class="form-control" name="rol" [(ngModel)]="usuarioSeleccionada.Rol">
                        <option value="0">Seleccione</option>
                        <option value="1">Administrador</option>
                        <option value="2">Evaluador</option>
                        <option value="3">Postulante</option>
                    </select>
                </div>

                <!-- Botones -->
                <div class="d-flex justify-content-between">
                    <button type="button" class="btn btn-secondary" (click)="volverALista()">
                        <i class="feather icon-arrow-left me-1"></i>
                        Volver
                    </button>

                    <button type="button" class="btn btn-success"
                        (click)="modoEdicion ? actualizarUsuario() : guardarUsuario()">
                        <i class="feather icon-save me-1"></i>
                        {{ modoEdicion ? 'Actualizar' : 'Guardar' }}
                    </button>
                </div>

            </form>
        </app-card>
    </div>
</div>

<div class="row btn-page">
    <div class="col-md-12">
        <app-card cardTitle="Asignación de Evaluadores" [options]="false">

            <!-- Filtros -->
            <div class="row align-items-end g-2">
                <div class="col-md-2">
                    <label class="form-label">Año</label>
                    <select class="form-control">
                        <option value="">Todos</option>
                        <option>2025</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Convocatoria</label>
                    <select class="form-control">
                        <option value="">Seleccione</option>
                        <option>Convocatoria A</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <button type="button" class="btn btn-info">
                        <i class="feather icon-search me-1"></i>
                        Buscar
                    </button>
                </div>
            </div>

            <hr class="my-4" />

            <!-- Tabla dinámica -->
            <div class="table-responsive">
                <table class="table table-striped table-bordered">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Nombre del Postulante</th>
                            <th>DNI</th>
                            <th>Fecha Inscripción</th>
                            <th>Puntaje</th>
                            <th>Estado</th>
                         </tr>
                    </thead>
                    <tbody>
                        <!-- Ejemplo de fila -->
                        <tr>
                            <td>1</td>
                            <td>Juan Pérez</td>
                            <td>12345678</td>
                            <td>01/01/2025</td>
                            <td>85%</td>
                            <td>
                                <button type="button" class="btn btn-success">Evaluado</button>
                            </td>
                            <!-- <td>
                                <button class="btn btn-sm btn-warning me-1">
                                    <i class="feather icon-edit"></i>
                                </button>
                                <button class="btn btn-sm btn-danger">
                                    <i class="feather icon-trash-2"></i>
                                </button>
                            </td> -->
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Paginación -->
            <nav>
                <ul class="pagination justify-content-end">
                    <li class="page-item disabled"><a class="page-link">Anterior</a></li>
                    <li class="page-item active"><a class="page-link" href="#">1</a></li>
                    <li class="page-item"><a class="page-link" href="#">2</a></li>
                    <li class="page-item"><a class="page-link" href="#">Siguiente</a></li>
                </ul>
            </nav>


        </app-card>
    </div>
</div>

<div class="row btn-page">
  <div class="col-12">
    <app-card cardTitle="Asignación de Evaluadores" [options]="false">
      <div class="table-responsive">
        <table class="table table-hover align-middle modern-table">
          <thead>
            <tr>
              <th>Título</th>
              <th>Tipo</th>
              <th>Unidad Zonal</th>
              <th>Fecha</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let postulacion of postulaciones">
              <td><strong>{{ postulacion.vTituloConvocatoria }}</strong></td>
              <td>
                <span class="badge bg-primary">{{ postulacion.vTipoConvocatoria }}</span>
              </td>
              <td>{{ postulacion.vUnidadZonal }}</td>
              <td>{{ postulacion.dtFechaPostulacion | date: 'mediumDate' }}</td>
              <td class="text-center">
                <button class="btn btn-outline-danger btn-sm" (click)="eliminarPostulacion(postulacion.iCodPostulacion)"
                  [disabled]="postulacion.vEstadoConvocatoria !== 'EN PROCESO'"
                  title="{{ postulacion.vEstadoConvocatoria !== 'EN PROCESO' ? 'No se puede eliminar en este estado' : '' }}">
                  <i class="bi bi-trash"></i>
                  <span class="d-none d-md-inline">Eliminar</span>
                </button>

              </td>
            </tr>
            <tr *ngIf="!postulaciones || postulaciones.length === 0">
              <td colspan="5" class="text-center py-4 text-muted">No se encontraron postulaciones.</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Paginación -->
      <nav *ngIf="totalPaginas > 1" aria-label="Paginación" class="mt-4">
        <ul class="pagination justify-content-center">
          <li class="page-item" [class.disabled]="paginaActual === 1">
            <button class="page-link" (click)="anteriorPagina()" aria-label="Anterior">
              <i class="bi bi-chevron-left"></i>
            </button>
          </li>

          <li class="page-item" *ngFor="let _ of [].constructor(totalPaginas); let i = index"
            [class.active]="paginaActual === i + 1">
            <button class="page-link" (click)="irPagina(i + 1)">{{ i + 1 }}</button>
          </li>

          <li class="page-item" [class.disabled]="paginaActual === totalPaginas">
            <button class="page-link" (click)="siguientePagina()" aria-label="Siguiente">
              <i class="bi bi-chevron-right"></i>
            </button>
          </li>
        </ul>
      </nav>
    </app-card>

  </div>
</div>

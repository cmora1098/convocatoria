<!-- Modal Cambiar Contraseña -->
<div class="modal fade" id="modalCambiarPassword" tabindex="-1" [ngClass]="{ 'show d-block': mostrarModalPassword }"
  role="dialog">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">Cambiar Contraseña</h5>
        <button type="button" class="btn-close btn-close-white" (click)="cerrarModalPassword()"></button>
      </div>

      <div class="modal-body">
        <form>

          <!-- Contraseña actual -->
          <div class="mb-3">
            <label class="form-label fw-bold">Contraseña actual *</label>
            <div class="input-group">
              <input [type]="verPasswordActual ? 'text' : 'password'" class="form-control" [(ngModel)]="passwordActual"
                name="passwordActual" placeholder="Ingrese su contraseña actual" />
              <button class="btn btn-outline-secondary" type="button" (click)="verPasswordActual = !verPasswordActual">
                <i class="feather" [ngClass]="verPasswordActual ? 'icon-eye-off' : 'icon-eye'"></i>
              </button>
            </div>
          </div>

          <!-- Nueva contraseña -->
          <div class="mb-3">
            <label class="form-label fw-bold">Nueva contraseña *</label>
            <div class="input-group">
              <input [type]="verNuevaPassword ? 'text' : 'password'" class="form-control" [(ngModel)]="nuevaPassword"
                name="nuevaPassword" placeholder="Ingrese su nueva contraseña" />
              <button class="btn btn-outline-secondary" type="button" (click)="verNuevaPassword = !verNuevaPassword">
                <i class="feather" [ngClass]="verNuevaPassword ? 'icon-eye-off' : 'icon-eye'"></i>
              </button>
            </div>
          </div>

        </form>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="cerrarModalPassword()">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="guardarPassword()">Guardar</button>
      </div>

    </div>
  </div>
</div>
